<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Torneo 🕹️</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body {
        padding-bottom: 30px;
      }
      /* pantalla de unirse */
      #joinScreen {
        max-width: 420px;
        margin: 40px auto;
        padding: 20px;
      }
      /* pantalla de espera */
      #waitScreen {
        text-align: center;
        padding: 60px 20px;
      }
      /* pantalla de juego */
      #playScreen {
        max-width: 520px;
        margin: 0 auto;
        padding: 16px;
      }
      .my-score-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        background: var(--panel);
        border-bottom: 2px solid var(--line);
        font-family: "Press Start 2P", monospace;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="op-stripe"></div>

    <!-- ── UNIRSE ── -->
    <div id="joinScreen" class="col">
      <div class="center" style="margin-bottom: 20px">
        <svg class="ic" width="44" height="44" viewBox="0 0 24 24" fill="none" shape-rendering="crispEdges" style="color: var(--dbz-orange); filter: drop-shadow(2px 2px 0 #000);"><use href="#i-dragon"/></svg>
        <h1 class="anime-title" style="margin-top: 8px" id="joinTitle">Copa de Cumple</h1>
      </div>

      <div class="card col">
        <h2><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;color:var(--op-red);"><use href="#i-sword"/></svg> Tu apodo de pirata</h2>
        <input
          type="text"
          id="inpName"
          placeholder="ej. Luffy"
          maxlength="16"
          autocomplete="off"
        />

        <div class="avatar-picker">
          <div class="avatar-preview" id="avatarPreview"></div>
          <button type="button" class="scramble-btn" id="scrambleAvatarsBtn" title="Probar otro avatar">
            <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;color:var(--blue-dark);"><use href="#i-dragon"/></svg>
            <span style="margin-left:4px">otra</span>
          </button>
        </div>
        <div style="font-size:14px;color:var(--dim);line-height:1.3">
          Tu avatar se genera de tu apodo. Tocá “otra” para ver otro.
        </div>
      </div>

      <button class="btn magenta big full" id="joinBtn"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;margin-right:6px;color:var(--yellow);"><use href="#i-anchor"/></svg> ZARPAR AL TORNEO</button>
      <div
        id="joinError"
        style="
          color: var(--magenta);
          font-size: 16px;
          text-align: center;
          margin-top: 8px;
        "
      ></div>
    </div>

    <!-- ── ESPERANDO ── -->
    <div id="waitScreen" class="hidden col">
      <svg class="ic" width="56" height="56" viewBox="0 0 24 24" fill="none" shape-rendering="crispEdges" style="display:block;margin:0 auto 16px;color:var(--op-wood);filter:drop-shadow(3px 3px 0 #000);"><use href="#i-anchor"/></svg>
      <h2 style="text-align:center">En el muelle, esperando zarpar...</h2>
      <div
        id="myNameBadge"
        class="badge green"
        style="margin: 16px auto 0"
      ></div>
      <div style="margin-top: 30px; text-align: center">
        <button class="btn" id="leaveWaitBtn" style="font-size: 9px">
          Abandonar tripulación
        </button>
      </div>
    </div>

    <!-- ── EN JUEGO ── -->
    <div id="playScreen" class="hidden">
      <div class="my-score-bar">
        <span id="myNameTop"></span>
        <span id="myScoreTop">0 PTS</span>
      </div>

      <!-- sub-pantalla: pregunta activa -->
      <div id="subQuestion" class="col" style="padding: 16px 0; gap: 12px">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <span
            id="qLabelPlay"
            style="font-size: 15px; color: var(--dim)"
          ></span>
          <div class="timer-big" id="timerPlay" style="font-size: 28px">30</div>
        </div>
        <div class="bar-track">
          <div class="bar-fill" id="timerBarPlay" style="width: 100%"></div>
        </div>
        <div
          class="card"
          style="display: flex; flex-direction: column; gap: 10px"
        >
          <img
            id="questionImgPlay"
            src=""
            alt=""
            style="
              width: 100%;
              max-height: 180px;
              object-fit: cover;
              display: none;
              border: 3px solid #000;
              box-shadow: 4px 4px 0 #000;
            "
          />
          <div
            id="questionTextPlay"
            style="font-size: 22px; line-height: 1.5"
          ></div>
        </div>
        <div class="options-grid" id="optionsPlay"></div>
      </div>

      <!-- sub-pantalla: feedback después de responder -->
      <div id="subFeedback" class="feedback-box hidden">
        <span class="emoji" id="feedbackEmoji">⏳</span>
        <div id="feedbackMsg" style="margin-bottom: 12px"></div>
        <div class="pts" id="feedbackPts"></div>
      </div>

      <!-- sub-pantalla: resultados ronda -->
      <div
        id="subResults"
        class="col hidden"
        style="padding: 16px 0; gap: 12px"
      >
        <h2 class="center"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;color:var(--op-red);"><use href="#i-swordCross"/></svg> RESULTADOS DE RONDA</h2>
        <div class="card col" style="gap: 6px" id="resultsLb"></div>
        <div
          class="badge green center"
          id="myRankBadge"
          style="align-self: center"
        ></div>
      </div>

      <!-- sub-pantalla: podio final -->
      <div
        id="subPodio"
        class="col hidden"
        style="padding: 16px 0; text-align: center; gap: 16px"
      >
        <h1 class="anime-title"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;color:var(--dbz-gold);filter:drop-shadow(2px 2px 0 #000);margin-right:6px"><use href="#i-trophy"/></svg> TORNEO DEL PODER <svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;color:var(--dbz-gold);filter:drop-shadow(2px 2px 0 #000);margin-left:6px"><use href="#i-trophy"/></svg></h1>
        <div class="podio" id="podioPlay"></div>
        <div
          id="myFinalRank"
          style="
            font-family: "Press Start 2P", monospace;
            font-size: 13px;
            color: var(--blue-dark);
          "
        ></div>
      </div>

      <div style="text-align: center; margin-top: 20px">
        <button
          class="btn"
          id="leaveGameBtn"
          style="font-size: 9px; opacity: 0.6"
        >
          Abandonar tripulación
        </button>
      </div>
    </div>

    <div class="op-stripe"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/play.js"></script>
  </body>
</html>
